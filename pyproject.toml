[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livechat-guard"
version = "0.1.0"
description = "YouTube Live chat moderation assistant with a Japanese desktop GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "LiveChatGuard contributors"}]
dependencies = [
    "PySide6>=6.6,<7",
    "google-api-python-client>=2.130,<3",
    "google-auth>=2.29,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<1",
    "keyring>=25,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
livechat-guard = "livechat_guard.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
